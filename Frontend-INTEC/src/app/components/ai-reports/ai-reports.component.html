<div class="content-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Reportes Ejecutivos con IA</h1>
    </div>
  </div>

  <div class="ai-layout">
    <!-- Sidebar de conversaciones -->
    <aside class="ai-sidebar">
      <button class="btn-new-chat" (click)="newConversation()">
        <i class="bi bi-plus-lg"></i> Nueva conversación
      </button>

      <div class="conversations-list">
        <div class="empty-hint" *ngIf="isLoadingConversations">Cargando...</div>
        <div class="empty-hint" *ngIf="!isLoadingConversations && conversations.length === 0">
          Aún no tienes conversaciones.
        </div>
        <div class="conversation-item" *ngFor="let conv of conversations" [class.active]="conv.id === currentConversationId"
          (click)="selectConversation(conv)">
          <span class="conversation-title">{{ conv.title }}</span>
          <button class="btn-delete-conv" (click)="deleteConversation(conv, $event)" title="Eliminar conversación">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Chat principal -->
    <section class="ai-chat">
      <div class="ai-messages" #scrollArea>
        <div class="ai-welcome" *ngIf="messages.length === 0">
          <i class="bi bi-robot ai-welcome-icon"></i>
          <p>Pregúntame sobre personal, nómina, inventario, préstamos o bonos.</p>
          <div class="suggestions">
            <button class="suggestion-chip" *ngFor="let s of suggestions" (click)="askSuggestion(s)">{{ s }}</button>
          </div>
        </div>

        <div class="ai-message" *ngFor="let m of messages" [class.user]="m.role === 'user'" [class.assistant]="m.role === 'assistant'">
          <div class="ai-bubble">
            <ng-container *ngIf="!m.pending; else typing">
              <div class="ai-bubble-text" *ngIf="m.role === 'assistant'; else userText" [innerHTML]="m.content | markdownLite"></div>
              <ng-template #userText>
                <p class="ai-bubble-text">{{ m.content }}</p>
              </ng-template>
              <app-ai-chart *ngIf="m.chart" [spec]="m.chart"></app-ai-chart>
            </ng-container>
            <ng-template #typing>
              <span class="typing-dots"><span></span><span></span><span></span></span>
            </ng-template>
          </div>
        </div>
      </div>

      <div class="ai-input-bar">
        <input type="text" class="ai-input" placeholder="Escribe tu pregunta..." [(ngModel)]="draft"
          (keydown.enter)="send()" [disabled]="isSending" />
        <button class="btn-send" (click)="send()" [disabled]="isSending || !draft.trim()">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </section>
  </div>
</div>
